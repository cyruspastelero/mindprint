name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          # Ubuntu 26.04 runners have no Python 3.9 build; macOS still covers 3.9.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -I -m unittest discover -s tests -v
      - name: Check example skills
        shell: bash
        run: |
          shopt -s nullglob
          examples=(examples/*-mind)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "No examples/*-mind directory yet; skipping."
            exit 0
          fi
          status=0
          for dir in "${examples[@]}"; do
            python -I skills/mindprint/scripts/mindprint.py check "$dir" || status=1
          done
          exit $status
